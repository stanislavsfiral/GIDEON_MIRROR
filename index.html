<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIDEON v13.7 - Sfiral Intel System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', monospace; color: #00ffcc; }
        
        /* Панель аналитики (Слева) */
        #telemetry {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0,10,10,0.95); padding: 15px; border: 1px solid #00ffcc; border-radius: 8px;
            width: 240px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); font-size: 12px;
        }
        .stat { margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px solid #00ffcc33; }
        .val { color: #ffcc00; font-weight: bold; }
        #sys-led { width: 10px; height: 10px; border-radius: 50%; background: #333; display: inline-block; margin-right: 8px; border: 1px solid #fff; }

        /* Контейнер верхних кнопок */
        .controls-container { position: fixed; top: 15px; right: 15px; z-index: 2001; display: flex; gap: 10px; }
        .control-btn { 
            background: #000; color: #ffcc00; border: 1px solid #ffcc00; 
            width: 35px; height: 35px; cursor: pointer; border-radius: 5px; 
            font-size: 18px; font-weight: bold; transition: 0.3s;
        }
        .control-btn:hover { background: #ffcc00; color: #000; box-shadow: 0 0 15px #ffcc00; }

        /* Панель управления (Справа) */
        #gideon-ui { 
            position: fixed; top: 65px; right: 15px; 
            background: rgba(0, 15, 15, 0.98); 
            padding: 15px; border: 1px solid #00ffcc; 
            z-index: 1000; width: 260px; 
            max-height: 80vh; overflow-y: auto; 
            border-radius: 8px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        h2 { font-size: 14px; margin: 0 0 10px 0; text-align: center; color: #fff; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; }
        .cat-group { margin-bottom: 10px; padding: 10px; border: 1px solid #00ffcc33; border-radius: 4px; background: rgba(0,30,30,0.3); }
        .cat-header { font-size: 9px; color: #ffcc00; margin-bottom: 8px; text-transform: uppercase; border-left: 3px solid #ffcc00; padding-left: 8px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        input, select { background: #000; border: 1px solid #00ffcc; color: #ffcc00; padding: 6px; font-size: 11px; width: 100%; box-sizing: border-box; }
        .m-btn { background: rgba(0, 40, 40, 0.7); border: 1px solid #00ffcc66; color: #fff; padding: 8px; font-size: 10px; cursor: pointer; border-radius: 3px; width: 100%; margin-top: 5px;}
        .m-btn:hover { background: #00ffcc; color: #000; }
        .m-btn.action { background: #008888; border: 1px solid #00ffcc; font-weight: bold; }
        #stats-box { position: fixed; bottom: 15px; right: 15px; font-size: 10px; color: #ffcc00; }
    </style>
</head>
<body>

    <!-- ТЕЛЕМЕТРИЯ QYDYR -->
    <div id="telemetry">
        <div style="font-weight: bold; margin-bottom: 10px; text-align: center; color: #00ffcc;">GIDEON ANALYTICS</div>
        <div class="stat"><span>SYS LED:</span><span><span id="sys-led"></span><span id="status-val">READY</span></span></div>
        <div class="stat">РЕЗОНАНС: <span id="coh-val" class="val">372.72</span></div>
        <div class="stat">PTS: <span id="count" class="val">0</span></div>
        <div class="stat">FPS: <span id="fps" class="val">0</span></div>
    </div>

    <div class="controls-container">
        <button class="control-btn" onclick="toggleUI()">≡</button>
    </div>

    <!-- КОНСТРУКТОР -->
    <div id="gideon-ui">
        <h2>КОНСТРУКТОР GIDEON</h2>
        
        <div class="cat-group">
            <div class="cat-header">⚛️ ГЕНЕРАТОР ЯДРА</div>
            <select id="axis-select">
                <option value="y">ОСЬ Y (ГОРИЗОНТАЛЬ)</option>
                <option value="x">ОСЬ X (ВЕРТИКАЛЬ)</option>
                <option value="z">ОСЬ Z (ГЛУБИНА)</option>
            </select>
            <input type="number" id="core-count" value="12" style="margin-top:5px;">
            <div class="btn-grid" style="margin-top:5px;">
                <button class="m-btn action" onclick="build3DCore(false)">НОВОЕ ЯДРО</button>
                <button class="m-btn action" style="background:#440066;" onclick="build3DCore(true)">+ СЛОЙ</button>
            </div>
        </div>

        <div class="cat-group">
            <div class="cat-header">🌀 МАТРИЦА (МАТРЕШКА)</div>
            <div style="display:flex; gap:5px; margin-bottom:5px;">
                <input type="number" id="nest-levels" value="3">
                <input type="number" id="nest-chain" value="4">
            </div>
            <button class="m-btn action" onclick="buildFractalChain()">BUILD MATRIX</button>
        </div>

        <div class="btn-grid">
            <button class="m-btn" style="border-color:#ff4444; color:#ff4444;" onclick="resetAll()">CLEAR</button>
            <button class="m-btn" style="border-color:#ffcc00; color:#ffcc00;" onclick="centerView()">CENTER</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const RESONANCE_STEP = 372.72;
        let scene, camera, renderer, controls, currentGroup;
        let baseDataArray = null;
        let lastTime = 0, frameCount = 0, totalPtsOnScreen = 0;
        const DEPTH_COLORS = [0xffffff, 0xffff00, 0x00ff00, 0xff00ff];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000000);
            camera.position.set(2000, 2000, 2000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            currentGroup = new THREE.Group();
            scene.add(currentGroup);

            loadProtectedCore().then(() => {
                build3DCore(false);
                animate(0);
            });
        }

        async function loadProtectedCore() {
            const parts = ['p1.npy', 'p2.npy', 'p3.npy', 'p4.npy'];
            let combined = [];
            try {
                for (let p of parts) {
                    const res = await fetch(`models/core_v8/${p}`);
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        combined.push(...new Float32Array(buffer.slice(128)));
                    }
                }
                baseDataArray = new Float32Array(combined);
                document.getElementById('sys-led').style.background = '#00ffcc';
                document.getElementById('status-val').innerText = 'ACTIVE';
            } catch (e) { 
                console.error("Ошибка загрузки моделей:", e); 
                document.getElementById('status-val').innerText = 'LOCAL MODE';
            }
        }

        function createPoints(data, scale = 1, colorIdx = 0) {
            const geo = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(data, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({ 
                color: DEPTH_COLORS[colorIdx % 4], size: 5 * scale, 
                transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false 
            }));
        }

        async function build3DCore(addLayer = false) {
            if (!baseDataArray) return;
            if (!addLayer) resetAll();
            const count = parseInt(document.getElementById('core-count').value);
            const axis = document.getElementById('axis-select').value;
            const angleStep = (Math.PI * 2) / count;
            for (let i = 0; i < count; i++) {
                const petal = new THREE.Group();
                const p1 = createPoints(baseDataArray, 1, addLayer ? 1 : 0);
                const p2 = createPoints(baseDataArray, 1, addLayer ? 1 : 0);
                p2.rotation.set(Math.PI, 0, Math.PI);
                petal.add(p1); petal.add(p2);
                if (axis === 'x') petal.rotation.x = i * angleStep;
                else if (axis === 'y') petal.rotation.y = i * angleStep;
                else if (axis === 'z') petal.rotation.z = i * angleStep;
                currentGroup.add(petal);
            }
            totalPtsOnScreen += (baseDataArray.length/3)*2*count;
            updateStats();
        }

        async function buildFractalChain() {
            if (!baseDataArray) return;
            resetAll();
            const levels = parseInt(document.getElementById('nest-levels').value);
            const chainLen = parseInt(document.getElementById('nest-chain').value);
            let pts = 0;
            for (let c = 0; c < chainLen; c++) {
                const linkGroup = new THREE.Group();
                pts += generateRecursive(1, levels, new THREE.Vector3(0,0,0), 1, linkGroup);
                linkGroup.position.z = c * RESONANCE_STEP;
                if (c % 2 !== 0) linkGroup.rotation.x = Math.PI;
                currentGroup.add(linkGroup);
            }
            totalPtsOnScreen = pts;
            updateStats();
        }

        function generateRecursive(lvl, max, pos, scale, group) {
            const p = createPoints(baseDataArray, scale, lvl-1);
            p.position.copy(pos); p.scale.set(scale, scale, scale);
            group.add(p);
            let pts = (baseDataArray.length/3);
            if (lvl < max) {
                const s = scale * 0.5;
                const shiftX = 75 * scale;
                const shiftZ = (RESONANCE_STEP / 4) * scale; 
                pts += generateRecursive(lvl+1, max, new THREE.Vector3(pos.x - shiftX, pos.y, pos.z - shiftZ), s, group);
                pts += generateRecursive(lvl+1, max, new THREE.Vector3(pos.x + shiftX, pos.y, pos.z + shiftZ), s, group);
            }
            return pts;
        }

        function resetAll() { 
            scene.remove(currentGroup); 
            currentGroup = new THREE.Group(); 
            scene.add(currentGroup); 
            totalPtsOnScreen = 0; 
            updateStats();
        }

        function updateStats() {
            document.getElementById('count').innerText = Math.round(totalPtsOnScreen).toLocaleString();
            setTimeout(centerView, 100);
        }

        function animate(time) {
            requestAnimationFrame(animate); 
            frameCount++;
            if (time >= lastTime + 1000) { 
                document.getElementById('fps').innerText = frameCount; 
                frameCount = 0; 
                lastTime = time; 
            }
            controls.update(); 
            renderer.render(scene, camera);
        }

        function centerView() {
            const box = new THREE.Box3().setFromObject(currentGroup);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            camera.position.set(center.x, center.y, center.z + Math.max(size.x, size.y, size.z)*1.8);
            controls.target.copy(center);
        }

        function toggleUI() {
            const ui = document.getElementById('gideon-ui');
            ui.style.display = ui.style.display === 'none' ? 'block' : 'none';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
